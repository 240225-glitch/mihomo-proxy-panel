mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
external-controller: 127.0.0.1:9090

# >>> panel-users (auto-generated by panel, do not edit)
listeners:
  - name: lan-mixed
    type: mixed
    port: 7891
    listen: 0.0.0.0
    users:
      - username: 'admin'
        password: 'change-me'
# <<< panel-users

proxy-providers:
  free:
    type: http
    url: https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt
    path: ./free.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
      timeout: 4000

proxy-groups:
  - name: MAIN
    type: select
    proxies: [AUTO, TH, MANUAL, DIRECT]

  - name: AUTO
    type: url-test
    use: [free]
    url: https://www.gstatic.com/generate_204
    interval: 180
    timeout: 4000
    tolerance: 50

  - name: TH
    type: url-test
    use: [free]
    filter: "(?i)(-TH|TH-|泰国|曼谷|Bangkok)"
    url: https://www.gstatic.com/generate_204
    interval: 180
    timeout: 4000
    tolerance: 50

  # 控制台里手动点选的节点会进这个分组
  - name: MANUAL
    type: select
    use: [free]

rules:
  - MATCH,MAIN
